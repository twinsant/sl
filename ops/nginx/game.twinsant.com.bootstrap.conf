server {
    listen 80;
    listen [::]:80;
    server_name game.twinsant.com;

    root /root/projects/sl;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}